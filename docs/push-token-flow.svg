<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 680" width="1180" height="680" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>CyVault — Sending a push with workload identity federation</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0284C7"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
    <style>
      .t-title { font-size: 22px; font-weight: 700; fill: #0F172A; }
      .t-sub { font-size: 12.5px; fill: #64748B; }
      .t-actor { font-size: 14px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .t-actorsub { font-size: 10.5px; fill: #475569; text-anchor: middle; }
      .t-msg { font-size: 12.5px; font-weight: 700; fill: #0F172A; }
      .t-body { font-size: 11.5px; fill: #334155; font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
      .t-small { font-size: 11px; fill: #475569; }
      .t-panel { font-size: 13px; font-weight: 700; fill: #0F172A; }
      .t-num { font-size: 11px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .life { stroke: #94A3B8; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .req { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .res { stroke: #0284C7; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowBlue); }
      .check { stroke: #94A3B8; stroke-width: 1.2; fill: none; stroke-dasharray: 2 4; marker-end: url(#arrowGray); }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1180" height="680" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="40" y="36" class="t-title">Sending a push: workload identity federation</text>
  <text x="40" y="58" class="t-sub">The Function proves who it is with its Azure managed identity; no Google key is stored anywhere. Steps 1–3 run about once an hour (token cached).</text>

  <!-- Actors -->
  <rect x="30" y="80" width="160" height="50" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="110" y="101" class="t-actor">CyVault API</text>
  <text x="110" y="118" class="t-actorsub">Azure Function · managed identity</text>
  <rect x="230" y="80" width="160" height="50" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="310" y="101" class="t-actor">Entra ID</text>
  <text x="310" y="118" class="t-actorsub">Azure</text>
  <rect x="430" y="80" width="160" height="50" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="510" y="101" class="t-actor">Google STS</text>
  <text x="510" y="118" class="t-actorsub">sts.googleapis.com</text>
  <rect x="630" y="80" width="160" height="50" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="710" y="101" class="t-actor">IAM Credentials</text>
  <text x="710" y="118" class="t-actorsub">iamcredentials.googleapis.com</text>
  <rect x="830" y="80" width="160" height="50" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="910" y="101" class="t-actor">FCM</text>
  <text x="910" y="118" class="t-actorsub">fcm.googleapis.com · HTTP v1</text>
  <rect x="1010" y="80" width="150" height="50" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="1085" y="101" class="t-actor">Receiver's phone</text>
  <text x="1085" y="118" class="t-actorsub">CyVault app</text>

  <!-- Lifelines -->
  <line x1="110" y1="132" x2="110" y2="560" class="life"/>
  <line x1="310" y1="132" x2="310" y2="560" class="life"/>
  <line x1="510" y1="132" x2="510" y2="560" class="life"/>
  <line x1="710" y1="132" x2="710" y2="560" class="life"/>
  <line x1="910" y1="132" x2="910" y2="560" class="life"/>
  <line x1="1085" y1="132" x2="1085" y2="560" class="life"/>

  <!-- 1: Azure token -->
  <circle cx="22" cy="168" r="9" fill="#D97706"/><text x="22" y="172" class="t-num">1</text>
  <path d="M112 176 H306" class="req"/>
  <text x="124" y="168" class="t-msg">Get a token</text>
  <text x="124" y="194" class="t-body">for the federation audience</text>
  <path d="M308 222 H114" class="res"/>
  <text x="210" y="214" class="t-body" text-anchor="middle">Azure token (signed JWT)</text>

  <!-- 2: STS exchange -->
  <circle cx="22" cy="262" r="9" fill="#D97706"/><text x="22" y="266" class="t-num">2</text>
  <path d="M112 270 H506" class="req"/>
  <text x="124" y="262" class="t-msg">POST /v1/token (token exchange)</text>
  <text x="124" y="288" class="t-body">subject_token = Azure token</text>
  <path d="M508 306 H314" class="check"/>
  <text x="520" y="302" class="t-small">checks tenant, audience and</text>
  <text x="520" y="317" class="t-small">the Function's identity; verifies</text>
  <text x="520" y="332" class="t-small">the signature (Entra's keys)</text>
  <path d="M508 360 H114" class="res"/>
  <text x="310" y="352" class="t-body" text-anchor="middle">federated token (short-lived)</text>

  <!-- 3: impersonate -->
  <circle cx="22" cy="402" r="9" fill="#D97706"/><text x="22" y="406" class="t-num">3</text>
  <path d="M112 410 H706" class="req"/>
  <text x="124" y="402" class="t-msg">generateAccessToken: act as the FCM service account</text>
  <text x="124" y="428" class="t-body">Authorization: federated token</text>
  <path d="M708 452 H114" class="res"/>
  <text x="410" y="444" class="t-body" text-anchor="middle">access token · 1 hour · cached</text>

  <!-- 4: send -->
  <circle cx="22" cy="494" r="9" fill="#D97706"/><text x="22" y="498" class="t-num">4</text>
  <path d="M112 502 H906" class="req"/>
  <text x="124" y="494" class="t-msg">POST /v1/projects/…/messages:send</text>
  <text x="124" y="520" class="t-body">Bearer access token · receiver's device token</text>
  <path d="M912 540 H1081" class="req"/>
  <text x="922" y="532" class="t-body">"You received 20.50 EUR"</text>

  <!-- Footer -->
  <rect x="30" y="584" width="1130" height="70" rx="8" class="panel"/>
  <text x="48" y="608" class="t-panel">Why no secret</text>
  <text x="48" y="628" class="t-small">Entra ID and Google never talk to each other: the Function carries each token to the next step, and STS only reads Entra's public keys.</text>
  <text x="48" y="644" class="t-small">The service account has no key, and every token expires within an hour, so there is nothing long-lived to steal.</text>
</svg>
