<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1025" width="1400" height="1025" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>CyVault — Modular Architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97706"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
    <style>
      .t-title { font-size: 22px; font-weight: 700; fill: #0F172A; }
      .t-sub { font-size: 12.5px; fill: #64748B; }
      .t-panel { font-size: 15px; font-weight: 700; fill: #0F172A; }
      .t-band { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; fill: #475569; }
      .t-box { font-size: 13px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .t-boxsub { font-size: 10px; fill: #475569; text-anchor: middle; }
      .t-pkg { font-size: 11.5px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .t-chip { font-size: 10.5px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .t-chipsub { font-size: 9.5px; fill: #334155; text-anchor: middle; }
      .t-empty { font-size: 9.5px; font-style: italic; fill: #94A3B8; text-anchor: middle; }
      .t-small { font-size: 11px; fill: #475569; }
      .t-rule { font-size: 12.5px; fill: #1E293B; }
      .box { fill: #FFFFFF; stroke-width: 1.5; }
      .ui { fill: #E0EDFF; stroke: #2563EB; stroke-width: 1.2; }
      .dom { fill: #E3F6E8; stroke: #16A34A; stroke-width: 1.2; }
      .dat { fill: #FFF1DC; stroke: #D97706; stroke-width: 1.2; }
      .wire { fill: #F1F5F9; stroke: #64748B; stroke-width: 1.2; }
      .pkg { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1.2; }
      .dep { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .back { stroke: #D97706; stroke-width: 1.6; fill: none; marker-end: url(#arrowOrange); }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1400" height="1025" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="40" y="34" class="t-title">CyVault — Modular Architecture</text>
  <text x="40" y="56" class="t-sub">Kotlin Multiplatform · Android + iOS · Compose Multiplatform · Koin · Ktor · Navigation Compose · Microsoft Entra External ID (MSAL)</text>

  <!-- ===================== LEFT: MODULE GRAPH ===================== -->

  <!-- Band: platform shells -->
  <rect x="40" y="85" width="810" height="70" rx="10" fill="#EEF2F7" stroke="#94A3B8"/>
  <text x="52" y="102" class="t-band">PLATFORM SHELLS</text>
  <rect x="230" y="100" width="170" height="44" rx="8" class="box" stroke="#64748B"/>
  <text x="315" y="118" class="t-box">androidApp</text>
  <text x="315" y="134" class="t-boxsub">Application · MainActivity · Koin start</text>
  <rect x="480" y="100" width="170" height="44" rx="8" class="box" stroke="#64748B"/>
  <text x="565" y="118" class="t-box">iosApp</text>
  <text x="565" y="134" class="t-boxsub">SwiftUI host · AmplifyAuthBridge</text>

  <!-- Band: app -->
  <rect x="40" y="180" width="810" height="70" rx="10" fill="#EDE9FE" stroke="#8B5CF6"/>
  <text x="52" y="197" class="t-band">COMPOSITION ROOT</text>
  <rect x="245" y="193" width="390" height="44" rx="8" class="box" stroke="#7C3AED"/>
  <text x="440" y="211" class="t-box">app</text>
  <text x="440" y="227" class="t-boxsub">all routes + the only NavHost · Koin appModules · CyVaultApp iOS framework</text>

  <path d="M315 146 L385 191" class="dep"/>
  <path d="M565 146 L495 191" class="dep"/>

  <!-- Band: feature modules -->
  <rect x="40" y="275" width="810" height="338" rx="10" fill="#F1F6FF" stroke="#3B82F6"/>
  <text x="52" y="292" class="t-band">FEATURE MODULES</text>

  <!-- feature:authentication -->
  <rect x="55" y="305" width="220" height="293" rx="8" class="box" stroke="#2563EB"/>
  <text x="165" y="327" class="t-box">authentication</text>
  <text x="165" y="343" class="t-boxsub">one flow · layers at the module root</text>

  <rect x="67" y="356" width="196" height="70" rx="5" class="ui"/>
  <text x="165" y="371" class="t-chip">presentation</text>
  <text x="165" y="386" class="t-chipsub">AuthScreen · LoginScreen</text>
  <text x="165" y="399" class="t-chipsub">RegisterScreen · VerificationScreen</text>
  <text x="165" y="412" class="t-chipsub">ForgotPasswordScreen · AuthViewModel</text>

  <rect x="67" y="434" width="196" height="58" rx="5" class="dom"/>
  <text x="165" y="449" class="t-chip">domain</text>
  <text x="165" y="464" class="t-chipsub">User · AuthRepository</text>
  <text x="165" y="477" class="t-chipsub">Login · Register · ConfirmSignUp · …</text>

  <rect x="67" y="500" width="196" height="70" rx="5" class="dat"/>
  <text x="165" y="515" class="t-chip">data</text>
  <text x="165" y="530" class="t-chipsub">AuthRepositoryImpl · AuthApiService</text>
  <text x="165" y="543" class="t-chipsub">Android: MSAL native auth</text>
  <text x="165" y="556" class="t-chipsub">iOS: IosAuthBridge (Swift)</text>

  <rect x="67" y="578" width="196" height="48" rx="5" class="wire"/>
  <text x="165" y="593" class="t-chip">session</text>
  <text x="165" y="607" class="t-chipsub">SessionManagerImpl</text>
  <text x="165" y="619" class="t-chipsub">implements core's SessionManager</text>

  <!-- feature:vault -->
  <rect x="290" y="305" width="545" height="293" rx="8" class="box" stroke="#2563EB"/>
  <text x="562" y="327" class="t-box">vault</text>
  <text x="562" y="343" class="t-boxsub">feature:vault · one package per screen, each with its own layers and Koin module, plus a shared card/ package</text>

  <!-- package headers -->
  <rect x="300" y="354" width="168" height="24" rx="5" class="pkg"/>
  <text x="384" y="370" class="t-pkg">home/</text>
  <rect x="477" y="354" width="168" height="24" rx="5" class="pkg"/>
  <text x="561" y="370" class="t-pkg">addcard/</text>
  <rect x="655" y="354" width="168" height="24" rx="5" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.2"/>
  <text x="739" y="370" class="t-pkg">card/ (shared)</text>

  <!-- home/ -->
  <rect x="300" y="384" width="168" height="70" rx="5" class="ui"/>
  <text x="384" y="399" class="t-chip">presentation</text>
  <text x="384" y="414" class="t-chipsub">VaultHomeScreen</text>
  <text x="384" y="427" class="t-chipsub">card list · drawer · sign-out</text>
  <text x="384" y="440" class="t-chipsub">VaultHomeViewModel</text>
  <rect x="300" y="462" width="168" height="58" rx="5" class="dom"/>
  <text x="384" y="477" class="t-chip">domain</text>
  <text x="384" y="492" class="t-chipsub">GetCardsUseCase</text>
  <text x="384" y="505" class="t-chipsub">DeleteCardUseCase</text>
  <text x="384" y="546" class="t-empty">data from card/ · sign-out</text>
  <text x="384" y="559" class="t-empty">via core's SessionManager</text>

  <!-- addcard/ -->
  <rect x="477" y="384" width="168" height="70" rx="5" class="ui"/>
  <text x="561" y="399" class="t-chip">presentation</text>
  <text x="561" y="414" class="t-chipsub">AddCardScreen (own top bar)</text>
  <text x="561" y="427" class="t-chipsub">AddCardViewModel</text>
  <text x="561" y="440" class="t-chipsub">BankAppLauncher</text>
  <rect x="477" y="462" width="168" height="58" rx="5" class="dom"/>
  <text x="561" y="477" class="t-chip">domain</text>
  <text x="561" y="492" class="t-chipsub">BankRepository</text>
  <text x="561" y="505" class="t-chipsub">Institution · BankAccount</text>
  <rect x="477" y="528" width="168" height="58" rx="5" class="dat"/>
  <text x="561" y="543" class="t-chip">data</text>
  <text x="561" y="558" class="t-chipsub">YapilyService · DTOs</text>
  <text x="561" y="571" class="t-chipsub">BankRepositoryImpl</text>

  <!-- card/ (shared) -->
  <text x="739" y="424" class="t-empty">used by home/</text>
  <text x="739" y="437" class="t-empty">and addcard/</text>
  <rect x="655" y="462" width="168" height="58" rx="5" class="dom"/>
  <text x="739" y="477" class="t-chip">domain</text>
  <text x="739" y="492" class="t-chipsub">Card · CardType</text>
  <text x="739" y="505" class="t-chipsub">CardRepository</text>
  <rect x="655" y="528" width="168" height="58" rx="5" class="dat"/>
  <text x="739" y="543" class="t-chip">data</text>
  <text x="739" y="558" class="t-chipsub">CardApiService · DTOs</text>
  <text x="739" y="571" class="t-chipsub">CardRepositoryImpl</text>

  <!-- app -> features -->
  <path d="M330 239 L190 302" class="dep"/>
  <path d="M520 239 L562 302" class="dep"/>
  <text x="560" y="268" class="t-small">routes + NavHost call the screens · loads Koin modules</text>


  <!-- features never import each other -->
  <path d="M277 330 L287 330" stroke="#DC2626" stroke-width="1.8" fill="none"/>
  <circle cx="282" cy="318" r="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/>
  <text x="282" y="322" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">✕</text>

  <!-- Band: shared modules -->
  <rect x="40" y="725" width="810" height="100" rx="10" fill="#EEEEF0" stroke="#94A3B8"/>
  <text x="52" y="742" class="t-band">SHARED MODULES</text>
  <rect x="150" y="752" width="320" height="56" rx="8" class="box" stroke="#64748B"/>
  <text x="310" y="773" class="t-box">core</text>
  <text x="310" y="789" class="t-boxsub">Ktor HttpClient · OkHttp / Darwin engines (Koin)</text>
  <text x="310" y="801" class="t-boxsub">SessionManager interface · no Compose, no routes</text>
  <rect x="500" y="752" width="335" height="56" rx="8" class="box" stroke="#64748B"/>
  <text x="667" y="773" class="t-box">systemdesign</text>
  <text x="667" y="789" class="t-boxsub">CyTheme · colors · typography · shapes</text>
  <text x="667" y="801" class="t-boxsub">CyButton · CyOutlinedTextField · CyTopAppBar</text>

  <!-- features -> shared modules -->
  <path d="M230 600 L260 750" class="dep"/>
  <path d="M420 600 L380 750" class="dep"/>
  <path d="M700 600 L690 750" class="dep"/>

  <!-- app -> core (side route) -->
  <path d="M637 215 H868 V836 H310 V811" class="dep"/>
  <text x="882" y="500" class="t-small" transform="rotate(90 882 500)" text-anchor="middle">app loads core's platform + network Koin modules</text>

  <!-- Rules + legend -->
  <rect x="40" y="845" width="810" height="160" rx="10" class="panel"/>
  <text x="56" y="871" class="t-panel">Dependency rules · a module only sees what its build.gradle.kts declares</text>
  <text x="56" y="896" class="t-rule"><tspan fill="#16A34A" font-weight="700">✓</tspan>  app  →  authentication, vault, core   (the only composition root: NavHost, Koin modules, iOS framework)</text>
  <text x="56" y="918" class="t-rule"><tspan fill="#16A34A" font-weight="700">✓</tspan>  authentication  →  core     ·     vault  →  core, systemdesign</text>
  <text x="56" y="940" class="t-rule"><tspan fill="#DC2626" font-weight="700">✕</tspan>  authentication ↔ vault: never import each other; app connects them with navigation callbacks</text>
  <text x="56" y="962" class="t-rule"><tspan fill="#DC2626" font-weight="700">✕</tspan>  vault's screen packages never import each other; only VaultScreens.kt puts them together</text>

  <line x1="56" y1="986" x2="96" y2="986" class="dep"/>
  <text x="104" y="990" class="t-small">depends on</text>
  <rect x="190" y="978" width="30" height="15" rx="4" class="ui"/>
  <text x="227" y="990" class="t-small">presentation</text>
  <rect x="315" y="978" width="30" height="15" rx="4" class="dom"/>
  <text x="352" y="990" class="t-small">domain</text>
  <rect x="410" y="978" width="30" height="15" rx="4" class="dat"/>
  <text x="447" y="990" class="t-small">data</text>
  <rect x="490" y="978" width="30" height="15" rx="4" class="wire"/>
  <text x="527" y="990" class="t-small">public screens · DI · session</text>

  <!-- ===================== RIGHT A: NAVIGATION ===================== -->
  <rect x="900" y="55" width="480" height="330" rx="10" class="panel"/>
  <text x="916" y="80" class="t-panel">Navigation</text>
  <text x="916" y="100" class="t-small">routes and the only NavHost live in app (App.kt) · start: AuthRoute</text>

  <rect x="920" y="150" width="125" height="56" rx="8" class="box" stroke="#2563EB"/>
  <text x="982" y="173" class="t-box">AuthRoute</text>
  <text x="982" y="190" class="t-boxsub">→ AuthScreen</text>
  <rect x="1077" y="150" width="125" height="56" rx="8" class="box" stroke="#2563EB"/>
  <text x="1139" y="173" class="t-box">VaultHomeRoute</text>
  <text x="1139" y="190" class="t-boxsub">→ VaultHomeScreen</text>
  <rect x="1234" y="150" width="125" height="56" rx="8" class="box" stroke="#2563EB"/>
  <text x="1296" y="173" class="t-box">AddCardRoute</text>
  <text x="1296" y="190" class="t-boxsub">→ AddCardScreen</text>

  <path d="M1047 165 L1074 165" class="dep"/>
  <text x="1061" y="140" class="t-small" text-anchor="middle">onAuthSuccess</text>
  <path d="M1204 165 L1231 165" class="dep"/>
  <text x="1218" y="140" class="t-small" text-anchor="middle">onAddCardClick</text>
  <path d="M1075 192 L1048 192" class="back"/>
  <text x="1061" y="226" class="t-small" text-anchor="middle">onSignedOut</text>
  <path d="M1232 192 L1205 192" class="back"/>
  <text x="1218" y="226" class="t-small" text-anchor="middle">onBack · onCardSaved</text>

  <text x="916" y="258" class="t-small">Features have no routes and no Navigation Compose; app calls their screens:</text>
  <text x="932" y="278" class="t-small">AuthScreen(onAuthSuccess)</text>
  <text x="932" y="294" class="t-small">VaultHomeScreen(onAddCardClick, onSignedOut)</text>
  <text x="932" y="310" class="t-small">AddCardScreen(onBack, onCardSaved)</text>
  <text x="916" y="334" class="t-small">Vault home has the menu and the drawer with sign-out; add card has</text>
  <text x="916" y="350" class="t-small">its own top bar with a back arrow.</text>
  <text x="916" y="372" class="t-small">popUpTo removes login after sign-in, and the vault after sign-out.</text>

  <!-- ===================== RIGHT B: SIGN-OUT CONTRACT ===================== -->
  <rect x="900" y="400" width="480" height="240" rx="10" class="panel"/>
  <text x="916" y="425" class="t-panel">Sign-out across features</text>
  <text x="916" y="445" class="t-small">vault signs the user out without importing authentication.</text>

  <rect x="920" y="462" width="200" height="46" rx="8" class="box" stroke="#2563EB"/>
  <text x="1020" y="481" class="t-box">VaultHomeViewModel</text>
  <text x="1020" y="497" class="t-boxsub">feature:vault · home/</text>
  <rect x="1165" y="462" width="200" height="46" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1265" y="481" class="t-box">SessionManager</text>
  <text x="1265" y="497" class="t-boxsub">core · interface: signOut()</text>
  <rect x="1165" y="535" width="200" height="46" rx="8" class="box" stroke="#2563EB"/>
  <text x="1265" y="554" class="t-box">SessionManagerImpl</text>
  <text x="1265" y="570" class="t-boxsub">feature:authentication · authModule</text>
  <rect x="920" y="535" width="200" height="46" rx="8" class="box" stroke="#D97706"/>
  <text x="1020" y="554" class="t-box">AuthRepository</text>
  <text x="1020" y="570" class="t-boxsub">signOut() → AuthApiService</text>

  <path d="M1122 485 L1162 485" class="dep"/>
  <text x="1142" y="478" class="t-small" text-anchor="middle">calls</text>
  <path d="M1265 533 L1265 511" class="dep"/>
  <text x="1273" y="526" class="t-small">implements</text>
  <path d="M1163 558 L1123 558" class="dep"/>
  <text x="1143" y="551" class="t-small" text-anchor="middle">uses</text>

  <text x="916" y="608" class="t-small">Koin injects SessionManagerImpl into VaultHomeViewModel; on success the</text>
  <text x="916" y="624" class="t-small">NavigateToLogin effect calls app's callback, which goes back to AuthRoute.</text>

  <!-- ===================== RIGHT C: EXTERNAL SERVICES ===================== -->
  <rect x="900" y="655" width="480" height="350" rx="10" class="panel"/>
  <text x="916" y="680" class="t-panel">External services</text>

  <rect x="920" y="700" width="180" height="50" rx="8" class="box" stroke="#D97706"/>
  <text x="1010" y="720" class="t-box">authentication · data</text>
  <text x="1010" y="737" class="t-boxsub">Android</text>
  <rect x="1160" y="700" width="200" height="50" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
  <text x="1260" y="720" class="t-box">Entra External ID</text>
  <text x="1260" y="737" class="t-boxsub">MSAL native auth · cyvault.ciamlogin.com</text>
  <path d="M1102 725 L1157 725" class="dep"/>

  <rect x="920" y="770" width="180" height="50" rx="8" class="box" stroke="#D97706" stroke-dasharray="5 4"/>
  <text x="1010" y="790" class="t-box">authentication · data</text>
  <text x="1010" y="807" class="t-boxsub">iOS (IosAuthBridge)</text>
  <rect x="1160" y="770" width="200" height="50" rx="8" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1260" y="790" class="t-box">AWS Cognito (Amplify)</text>
  <text x="1260" y="807" class="t-boxsub">iOS not migrated to Entra yet</text>
  <path d="M1102 795 L1157 795" class="dep"/>

  <rect x="920" y="840" width="180" height="50" rx="8" class="box" stroke="#D97706"/>
  <text x="1010" y="860" class="t-box">vault · addcard/data</text>
  <text x="1010" y="877" class="t-boxsub">YapilyService</text>
  <rect x="1160" y="840" width="200" height="50" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
  <text x="1260" y="860" class="t-box">Yapily API</text>
  <text x="1260" y="877" class="t-boxsub">open banking · api.yapily.com</text>
  <path d="M1102 865 L1157 865" class="dep"/>

  <rect x="920" y="910" width="180" height="50" rx="8" class="box" stroke="#D97706"/>
  <text x="1010" y="930" class="t-box">vault · card/data</text>
  <text x="1010" y="947" class="t-boxsub">CardApiService</text>
  <rect x="1160" y="910" width="200" height="50" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
  <text x="1260" y="930" class="t-box">CyVault card API</text>
  <text x="1260" y="947" class="t-boxsub">api.cyvault.com/v1/cards</text>
  <path d="M1102 935 L1157 935" class="dep"/>

  <text x="916" y="988" class="t-small">Yapily and the card API use core's shared Ktor HttpClient; dashed = still on AWS.</text>
</svg>
