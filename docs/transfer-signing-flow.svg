<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 820" width="1040" height="820" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>CyVault — Signing a transfer</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0284C7"/>
    </marker>
    <style>
      .t-title { font-size: 22px; font-weight: 700; fill: #0F172A; }
      .t-sub { font-size: 12.5px; fill: #64748B; }
      .t-actor { font-size: 14px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .t-actorsub { font-size: 10.5px; fill: #475569; text-anchor: middle; }
      .t-msg { font-size: 12.5px; font-weight: 700; fill: #0F172A; }
      .t-body { font-size: 11.5px; fill: #334155; font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
      .t-step { font-size: 12px; fill: #1E293B; }
      .t-num { font-size: 11px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .t-small { font-size: 11px; fill: #475569; }
      .t-panel { font-size: 13px; font-weight: 700; fill: #0F172A; }
      .life { stroke: #94A3B8; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .req { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .res { stroke: #0284C7; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowBlue); }
      .note-app { fill: #E0EDFF; stroke: #2563EB; stroke-width: 1.2; }
      .note-key { fill: #EDE9FE; stroke: #7C3AED; stroke-width: 1.2; }
      .note-srv { fill: #FFF1DC; stroke: #D97706; stroke-width: 1.2; }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1040" height="820" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="40" y="36" class="t-title">Signing a transfer: challenge and response</text>
  <text x="40" y="58" class="t-sub">One fingerprint approval = one transfer: this amount, to this payee, used once, within 2 minutes (PSD2 dynamic linking)</text>

  <!-- Actors -->
  <rect x="80" y="80" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="170" y="101" class="t-actor">App</text>
  <text x="170" y="118" class="t-actorsub">feature:vault</text>
  <rect x="380" y="80" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="470" y="101" class="t-actor">Android Keystore</text>
  <text x="470" y="118" class="t-actorsub">:devicekey · private key</text>
  <rect x="660" y="80" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="750" y="101" class="t-actor">Server</text>
  <text x="750" y="118" class="t-actorsub">CyVault API · Azure Functions</text>

  <!-- Lifelines -->
  <line x1="170" y1="132" x2="170" y2="640" class="life"/>
  <line x1="470" y1="132" x2="470" y2="640" class="life"/>
  <line x1="750" y1="132" x2="750" y2="640" class="life"/>

  <!-- 1: challenge request -->
  <path d="M172 168 H746" class="req"/>
  <text x="186" y="160" class="t-msg">POST /me/transfers/challenge</text>
  <text x="186" y="186" class="t-body">{ cardId, phoneNumber: "+351912…", amount: 50, currency: "EUR" }</text>

  <!-- Server: make + store nonce -->
  <rect x="764" y="200" width="250" height="92" rx="6" class="note-srv"/>
  <circle cx="782" cy="218" r="9" fill="#D97706"/><text x="782" y="222" class="t-num">1</text>
  <text x="798" y="222" class="t-step">Makes a random nonce "k9Xq…"</text>
  <circle cx="782" cy="244" r="9" fill="#D97706"/><text x="782" y="248" class="t-num">2</text>
  <text x="798" y="248" class="t-step">Stores it with user, cardId,</text>
  <text x="798" y="265" class="t-step">phone, 50, EUR</text>
  <text x="798" y="282" class="t-step">expires in 2 min · used = false</text>

  <!-- 2: nonce back -->
  <path d="M748 316 H174" class="res"/>
  <text x="560" y="308" class="t-body" text-anchor="middle">{ nonce: "k9Xq…" }</text>

  <!-- App: confirm screen -->
  <rect x="20" y="334" width="300" height="34" rx="6" class="note-app"/>
  <circle cx="38" cy="351" r="9" fill="#2563EB"/><text x="38" y="355" class="t-num">3</text>
  <text x="54" y="355" class="t-step">Shows "Send €50 to +351912…?"</text>

  <!-- 3: sign request to Keystore -->
  <path d="M172 400 H466" class="req"/>
  <text x="186" y="392" class="t-msg">sign(…) after fingerprint</text>
  <text x="186" y="418" class="t-body">"k9Xq…|card-1|+351912…|50|EUR"</text>

  <!-- Keystore: biometric + sign -->
  <rect x="484" y="432" width="250" height="60" rx="6" class="note-key"/>
  <circle cx="502" cy="450" r="9" fill="#7C3AED"/><text x="502" y="454" class="t-num">4</text>
  <text x="518" y="454" class="t-step">Fingerprint / face check, then</text>
  <text x="518" y="471" class="t-step">signs with the private key</text>
  <text x="518" y="486" class="t-small">(ECDSA P-256 · key never leaves)</text>

  <!-- signature back -->
  <path d="M468 512 H174" class="res"/>
  <text x="320" y="504" class="t-body" text-anchor="middle">signature</text>

  <!-- 4: transfer -->
  <path d="M172 552 H746" class="req"/>
  <text x="186" y="544" class="t-msg">POST /me/transfers</text>
  <text x="186" y="570" class="t-body">{ …same details, deviceId, nonce, signature }</text>

  <!-- Server checks -->
  <rect x="764" y="580" width="250" height="148" rx="6" class="note-srv"/>
  <circle cx="782" cy="598" r="9" fill="#D97706"/><text x="782" y="602" class="t-num">5</text>
  <text x="798" y="602" class="t-step">Nonce exists, unexpired, unused,</text>
  <text x="798" y="619" class="t-step">and this user's?</text>
  <circle cx="782" cy="642" r="9" fill="#D97706"/><text x="782" y="646" class="t-num">6</text>
  <text x="798" y="646" class="t-step">Details match what was stored?</text>
  <circle cx="782" cy="670" r="9" fill="#D97706"/><text x="782" y="674" class="t-num">7</text>
  <text x="798" y="674" class="t-step">Signature valid for this</text>
  <text x="798" y="691" class="t-step">device's public key?</text>
  <circle cx="782" cy="714" r="9" fill="#16A34A"/><text x="782" y="718" class="t-num">8</text>
  <text x="798" y="718" class="t-step">Marks the nonce used, moves money</text>

  <!-- What each part stops -->
  <rect x="20" y="660" width="720" height="140" rx="10" class="panel"/>
  <text x="36" y="686" class="t-panel">What each part stops</text>
  <text x="36" y="712" class="t-step"><tspan font-weight="700">Random nonce</tspan> → signatures made in advance</text>
  <text x="36" y="734" class="t-step"><tspan font-weight="700">Used once</tspan> → the same signed transfer sent twice (replay)</text>
  <text x="36" y="756" class="t-step"><tspan font-weight="700">Tied to amount and payee</tspan> → €50 made €5,000, or a new payee</text>
  <text x="36" y="778" class="t-step"><tspan font-weight="700">2-minute expiry</tspan> → a stolen code or signature used later</text>
  <text x="420" y="712" class="t-step"><tspan font-weight="700">Bound to the user</tspan> → someone else's challenge</text>
  <text x="420" y="734" class="t-step"><tspan font-weight="700">Keystore + biometric</tspan> → signing from another phone</text>
  <text x="420" y="778" class="t-step" style="fill: #DC2626; font-weight: 700">Any check fails → rejected, no money moves</text>

  <!-- Legend -->
  <line x1="764" y1="752" x2="804" y2="752" class="req"/>
  <text x="812" y="756" class="t-small">request</text>
  <line x1="764" y1="776" x2="804" y2="776" class="res"/>
  <text x="812" y="780" class="t-small">response</text>
</svg>
