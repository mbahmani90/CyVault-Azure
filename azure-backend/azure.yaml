# Azure Developer CLI project: `azd up` creates the resources in infra/ and deploys the API.
name: cyvault-backend
metadata:
  template: cyvault-backend
infra:
  provider: bicep
  path: infra
services:
  api:
    project: ./src/CyVault.Api
    language: dotnet
    host: function
hooks:
  # Creates or updates this environment's Entra app registrations, consent and user flow
  # (infra/entra/entra.json) and saves their IDs for Bicep. Needs `az login` to the tenant.
  preprovision:
    windows:
      shell: pwsh
      run: ./infra/entra/Set-EntraApps.ps1
      continueOnError: false
    posix:
      shell: pwsh
      run: ./infra/entra/Set-EntraApps.ps1
      continueOnError: false
