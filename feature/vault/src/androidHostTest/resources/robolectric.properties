# Robolectric settings for the Compose UI host tests.
# SDK 35: compileSdk is newer than any Robolectric runtime.
sdk=35
# Legacy modes skip Robolectric's native runtime, which can't load from a path with a space
# (such as a Windows user folder) and isn't needed to render and click Compose UI.
graphicsMode=LEGACY
sqliteMode=LEGACY
