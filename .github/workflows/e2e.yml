# E2E tests on an Android emulator (only here, not in Azure Pipelines):
#   Changes ─► Build ─► E2E tests ─► E2E result
# Manual runs only: Actions tab → E2E tests → Run workflow.
# Needs the repository secrets E2E_EMAIL and E2E_PASSWORD (a test account in the debug Entra tenant;
# the tests delete every balance on it).
name: E2E tests

on:
  workflow_dispatch:

# A new push to the same branch cancels the run in progress.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # "some-with-excludes": matches at least one pattern and none of the ! patterns.
          # The same exclusions as azure-pipelines.yml.
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!iosApp/**'
              - '!azure-backend/**'
              - '!amplify-backend/**'

  build:
    name: Build
    needs: changes
    # A manual run always builds, even if the last change was docs only.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Launches the wrapper; Gradle then provisions the daemon JDK in gradle/gradle-daemon-jvm.properties
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :androidApp:assembleDebug :e2e:compileTestKotlin
      - uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7

  e2e-tests:
    name: E2E tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      # Reads the Gradle cache the Build job wrote, so the APK isn't compiled from scratch again.
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Start Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2
          nohup appium --log "$RUNNER_TEMP/appium.log" > /dev/null 2>&1 &
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:4723/status > /dev/null; do sleep 2; done'

      # The emulator needs hardware acceleration; let the runner user open /dev/kvm
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: ./e2e/run-e2e.sh

      - name: Test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            e2e/build/test-results/e2eTest/
            e2e/build/reports/tests/e2eTest/
            ${{ runner.temp }}/appium.log
          retention-days: 7

  # One check for branch protection: passes when every job passed or was skipped (docs-only change).
  e2e-result:
    name: E2E result
    needs: [changes, build, e2e-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then exit 1; fi
          done
