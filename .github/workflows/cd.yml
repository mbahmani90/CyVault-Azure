# Push a version tag → a signed release on Google Play's internal track and a GitHub Release:
#   git tag v1.2.3 && git push origin v1.2.3
#
#   Build signed AAB + APK ─┬─► Upload to Google Play (internal)
#                           └─► Publish GitHub Release
#
# The version comes from the tag: v1.2.3 → versionName 1.2.3, versionCode 10203
# (major·10000 + minor·100 + patch, so it always grows; minor and patch < 100).
# Promoting a build from internal to production stays a manual step in Play Console.
#
# Needs (setup in README → Continuous delivery):
#   secrets   CYVAULT_KEYSTORE_BASE64, CYVAULT_KEYSTORE_PASSWORD, CYVAULT_KEY_PASSWORD (the upload key)
#   variables CYVAULT_KEY_ALIAS, PLAY_WORKLOAD_IDENTITY_PROVIDER, PLAY_SERVICE_ACCOUNT
# Play is reached through workload identity federation: Google trusts this repository's GitHub
# token, so no service account key is stored anywhere.
name: CD

on:
  push:
    tags: ["v*.*.*"]

# Never stop a release half-way.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build signed AAB and APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v6

      - name: Version from the tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::Tag must look like v1.2.3"; exit 1; }
          (( BASH_REMATCH[2] < 100 && BASH_REMATCH[3] < 100 )) || { echo "::error::Minor and patch must be below 100"; exit 1; }
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Decode the upload key
        env: { KEYSTORE_BASE64: "${{ secrets.CYVAULT_KEYSTORE_BASE64 }}" }
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Secret CYVAULT_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "CYVAULT_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release
        env:
          CYVAULT_KEYSTORE_PASSWORD: ${{ secrets.CYVAULT_KEYSTORE_PASSWORD }}
          CYVAULT_KEY_PASSWORD: ${{ secrets.CYVAULT_KEY_PASSWORD }}
          # Not a secret: as one, GitHub would mask the word everywhere in the logs.
          CYVAULT_KEY_ALIAS: ${{ vars.CYVAULT_KEY_ALIAS }}
        run: >
          ./gradlew :androidApp:bundleRelease :androidApp:assembleRelease
          -Pcyvault.versionName=${{ steps.version.outputs.name }}
          -Pcyvault.versionCode=${{ steps.version.outputs.code }}

      # Decided by the exit codes, not by parsing the tools' output.
      - name: Verify signatures
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify androidApp/build/outputs/apk/release/androidApp-release.apk
          # No -strict: an upload key is self-signed, so its chain never leads to a trusted CA,
          # which -strict counts as an error (exit 4) though the bundle is signed.
          jarsigner -verify androidApp/build/outputs/bundle/release/androidApp-release.aab

      - name: Collect release files
        env: { VERSION: "${{ steps.version.outputs.name }}" }
        run: |
          mkdir -p dist/play
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab dist/play/cyvault-$VERSION.aab
          # R8 is on: Play needs the mapping to show readable crash stack traces.
          cp androidApp/build/outputs/mapping/release/mapping.txt dist/play/mapping.txt
          mkdir -p dist/github
          cp androidApp/build/outputs/apk/release/androidApp-release.apk dist/github/cyvault-$VERSION.apk
          (cd dist/github && sha256sum *.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with: { name: play-bundle, path: dist/play/, if-no-files-found: error, retention-days: 7 }
      - uses: actions/upload-artifact@v7
        with: { name: release-files, path: dist/github/, if-no-files-found: error, retention-days: 7 }

      - name: Remove the upload key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/upload.jks"

  play:
    name: Upload to Google Play (internal)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Optional gate: add required reviewers to this environment in the repository settings.
    environment: google-play
    permissions:
      contents: read
      # The GitHub token Google's workload identity federation checks.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: play-bundle, path: bundle }

      # Short-lived credentials for the play-publisher service account; nothing long-lived exists.
      - id: google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.google.outputs.credentials_file_path }}
          packageName: com.cypressit.cyvault
          releaseFiles: bundle/*.aab
          mappingFile: bundle/mapping.txt
          tracks: internal
          status: completed

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: release-files, path: dist }
      # The APK is for sideloading: it's signed with the upload key, Play's with the app signing
      # key, so one can't update the other (uninstall first).
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "CyVault $VERSION" --generate-notes --verify-tag
